# Rootless applications (user managers and the containers they run) get RLIMIT_RTPRIO 99 so SCHED_FIFO
# requests succeed instead of failing with EPERM. A Quadlet unit can then set Ulimit=rtprio=99:99 on the
# container. Broad: covers every user manager including lingering ones, which /etc/security/limits.d does
# not reach. A deployment wanting narrower scope can drop this into user@<uid>.service.d/ instead.
[Service]
LimitRTPRIO=99
