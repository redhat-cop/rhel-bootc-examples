# Selects the stock realtime profile via tuned's recommender. The section name is the profile; a section
# with no match options matches unconditionally. Files across both recommend.d directories are merged by
# basename and evaluated in sorted order, first match wins, so 00- beats the package's 50-tuned.conf.
# The daemon consults the recommender when /etc/tuned/profile_mode is "auto" (shipped alongside) or empty.
#
# Verified 2026-11-19 by running the daemon against this image's /etc/tuned state: it logged "Running in
# automatic mode" then "Using 'realtime' profile", applied it, and wrote active_profile=realtime — with no
# selection unit present. Fresh-install only: tuned writes profile_mode itself, and bootc's /etc merge
# keeps that machine-local value across an image change, so switching an existing host onto this image
# leaves its old profile_mode/active_profile in force. See README.md.
[realtime]
